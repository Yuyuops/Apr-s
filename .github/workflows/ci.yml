name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: python audit_programs.py
      - run: python audit_hypotheses.py
      - run: python simulate.py --horizon 6 --text "Augmenter les dépenses publiques de 12 milliards d euros par an"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check web/app.js
      - run: node --check web/hypotheses.js
      - run: node --check web/labels.js
      - run: node --check web/dashboard.js
      - run: node --check web/measure-types.js
      - run: node --check web/openfisca.js
      - run: node --test web/engine.test.mjs
