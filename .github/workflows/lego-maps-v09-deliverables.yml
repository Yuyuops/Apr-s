name: LEGO Maps V0.9 final deliverables

on:
  push:
    branches:
      - research/lego-maps-v09-prototype-hyrule
    paths:
      - benchmark-results/maps-engine-v03/style_fidelity_v062/*.py
      - benchmark-results/maps-engine-v03/style_fidelity_v062/*.sh
      - benchmark-results/maps-engine-v03/style_fidelity_v062/*.json
      - benchmark-results/maps-engine-v03/style_fidelity_v062/styles/**
      - benchmark-results/maps-engine-v03/style_fidelity_v062/compositions/**
      - .github/workflows/lego-maps-v09-deliverables.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-cards-and-prototypes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LEGO_ENGINE_HOME: ${{ github.workspace }}/benchmark-results/20_portable_engine
      LEGO_NODE_MODULES: ${{ github.workspace }}/benchmark-results/20_portable_engine/node_modules
      NODE_PATH: ${{ github.workspace }}/benchmark-results/20_portable_engine/node_modules
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Install pinned LEGO engine dependencies
        run: bash benchmark-results/20_portable_engine/scripts/install.sh
      - name: Install browser for real LDraw meshes
        run: |
          cd benchmark-results/20_portable_engine
          npx playwright install chromium
      - name: Regenerate Italy, Scotland, Japan, UK and both reduced prototypes (build, independent validation, BOM, fragility, notice plan, renders, PDFs, concordance)
        shell: bash
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/benchmark-results/maps-engine-v03/style_fidelity_v062"
          bash "$BASE/regen_deliverables.sh" "$RUNNER_TEMP/v09" --render --pdf
      - name: Compare generated LDraw hashes with the committed manifest (report only)
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/v09" "$GITHUB_WORKSPACE/benchmark-results/maps-engine-v03/style_fidelity_v062/livraison_v09/deliverables_manifest.json" <<'PY'
          import json, sys
          new = json.load(open(sys.argv[1] + "/deliverables_manifest.json")); ref = json.load(open(sys.argv[2])); bad = 0
          for k, v in ref.items():
              same = new.get(k, {}).get("ldr_sha256") == v["ldr_sha256"]; bad += (not same)
              print(k, "pieces", new[k]["pieces"], "references", new[k]["references"], "LDRAW IDENTICAL TO LOCAL RUN" if same else "LDRAW DIFFERS FROM LOCAL RUN")
          print("hash mismatches:", bad)
          PY
      - name: Gate on every concordance check
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/v09" <<'PY'
          import json, sys
          bad = []
          for k in ("italia", "ecosse", "japon", "royaume_uni", "protoA_littoral", "protoB_cadre_titre"):
              r = json.load(open(f"{sys.argv[1]}/{k}/delivery_check.json")); print(k, r)
              if not r["all_ok"]: bad.append(k)
          assert not bad, bad
          PY
      - name: Upload light deliverables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lego-maps-v09-light
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/v09/deliverables_manifest.json
            ${{ runner.temp }}/v09/*/metrics.json
            ${{ runner.temp }}/v09/*/parts_list.csv
            ${{ runner.temp }}/v09/*/bom_verification.json
            ${{ runner.temp }}/v09/*/independent_validation.json
            ${{ runner.temp }}/v09/*/delivery_check.json
            ${{ runner.temp }}/v09/*/fragility.json
            ${{ runner.temp }}/v09/*/diorama.ldr
            ${{ runner.temp }}/v09/*/renders/face.png
            ${{ runner.temp }}/v09/*/renders/trois_quarts.png
            ${{ runner.temp }}/v09/*/renders/zoom.png
      - name: Upload heavy notice PDFs (not versioned in Git)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lego-maps-v09-notices-pdf
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/v09/*/notice_pas_a_pas.pdf
            ${{ runner.temp }}/v09/*/notice_illustree.pdf
