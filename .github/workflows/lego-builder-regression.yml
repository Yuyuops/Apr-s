name: LEGO Builder regression and photos-to-LEGO

on:
  push:
    branches:
      - research/lego-builder-photos-to-lego
      - research/lego-builder-commercial-outputs-20261108
    paths:
      - benchmark-results/lego-builder/**
      - '!benchmark-results/lego-builder/**.md'
      - '!benchmark-results/lego-builder/e2e_results/**'
      - benchmark-results/20_portable_engine/**
      - benchmark-results/tools/**
      - .github/workflows/lego-builder-regression.yml
  workflow_dispatch:
    inputs:
      run_reconstruction:
        description: "also run the photos -> GLB reconstruction on the Hugging Face Space (external service)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sculpture-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEGO_ENGINE_HOME: ${{ github.workspace }}/benchmark-results/20_portable_engine
      LEGO_NODE_MODULES: ${{ github.workspace }}/benchmark-results/20_portable_engine/node_modules
      NODE_PATH: ${{ github.workspace }}/benchmark-results/20_portable_engine/node_modules
      PYTHONPATH: ${{ github.workspace }}/benchmark-results/lego-builder:${{ github.workspace }}/benchmark-results/maps-engine-v03/style_fidelity_v062
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Fetch the GLB inputs (Git LFS)
        run: git lfs install --local && git lfs pull --include="benchmark-results/02_glb_gratuit_hunyuan2mv/*.glb"
      - name: BLOCKING - the committed GLB inputs are the reference ones
        run: python3 benchmark-results/lego-builder/tests/check_regression.py glb
      - name: Unit tests (fast)
        run: python3 -m pip install numpy pillow scipy -q && python3 benchmark-results/lego-builder/tests/test_unit.py
      - name: Install pinned engine dependencies
        run: bash benchmark-results/20_portable_engine/scripts/install.sh
      - name: Install browser for real LDraw meshes
        run: cd benchmark-results/20_portable_engine && npx playwright install chromium
      - name: Maps engine V16 option tests (options off by default, collision-free when on, deterministic)
        run: LEGO_ENGINE_HOME="$GITHUB_WORKSPACE/benchmark-results/20_portable_engine" "$GITHUB_WORKSPACE/benchmark-results/20_portable_engine/.venv/bin/python" benchmark-results/lego-builder/tests/test_engine_v16.py
      - name: Paco GLB -> LEGO (one command), notice isolated with a hard timeout
        run: |
          "$LEGO_ENGINE_HOME/.venv/bin/python" -m lego_builder run benchmark-results/02_glb_gratuit_hunyuan2mv/paco.glb --out "$RUNNER_TEMP/paco" --size-mm 400 --notice fast --notice-timeout 600
      - name: BLOCKING non-regression - Paco LDraw must equal the accepted V12.1 sha256
        run: python3 benchmark-results/lego-builder/tests/check_regression.py sculpture paco "$RUNNER_TEMP/paco/model/diorama.ldr" paco_V121_A_palette_V12
      - name: Beagle GLB -> LEGO
        run: |
          "$LEGO_ENGINE_HOME/.venv/bin/python" -m lego_builder run benchmark-results/02_glb_gratuit_hunyuan2mv/beagle.glb --out "$RUNNER_TEMP/beagle" --size-mm 400 --notice off
      - name: BLOCKING non-regression - Beagle LDraw must equal the accepted V12.1 sha256
        run: python3 benchmark-results/lego-builder/tests/check_regression.py sculpture beagle "$RUNNER_TEMP/beagle/model/diorama.ldr" beagle_V121
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lego-builder-sculptures
          retention-days: 14
          path: |
            ${{ runner.temp }}/paco/manifest.json
            ${{ runner.temp }}/paco/model/diorama.ldr
            ${{ runner.temp }}/paco/model/parts_list.csv
            ${{ runner.temp }}/paco/model/renders/*.png
            ${{ runner.temp }}/beagle/manifest.json
            ${{ runner.temp }}/beagle/model/diorama.ldr

  print-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEGO_ENGINE_HOME: ${{ github.workspace }}/benchmark-results/20_portable_engine
      LEGO_PRINT_PATH: /tmp/print_site
      PYTHONPATH: ${{ github.workspace }}/benchmark-results/lego-builder:${{ github.workspace }}/benchmark-results/maps-engine-v03/style_fidelity_v062
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Install pinned engine dependencies (LDraw library, Rebrickable database)
        run: bash benchmark-results/20_portable_engine/scripts/install.sh
      - name: Install the geometry kernel
        run: python3 -m pip install --target /tmp/print_site -r benchmark-results/lego-builder/requirements-print3d.txt
      - name: Experimental STL/3MF export of the committed Paco sample (bricks and modules)
        run: |
          "$LEGO_ENGINE_HOME/.venv/bin/python" -m lego_builder.print3d.cli benchmark-results/lego-builder/tests/data/paco_sample.ldr "$RUNNER_TEMP/print" --mode both
      - name: BLOCKING numeric validation of every STL/3MF (watertight, indices, bed, overlaps)
        run: |
          PYTHONPATH=/tmp/print_site:$PYTHONPATH "$LEGO_ENGINE_HOME/.venv/bin/python" benchmark-results/lego-builder/tests/validate_print_exports.py "$RUNNER_TEMP/print/bricks" 250
          PYTHONPATH=/tmp/print_site:$PYTHONPATH "$LEGO_ENGINE_HOME/.venv/bin/python" benchmark-results/lego-builder/tests/validate_print_exports.py "$RUNNER_TEMP/print/modules_export" 250
      - name: Shape-aware modules (convex hull of the real LDraw geometry) + dowel STL + tolerance coupon, BLOCKING numeric validation
        run: |
          B=benchmark-results/lego-builder
          "$LEGO_ENGINE_HOME/.venv/bin/python" -m lego_builder.print3d.cli $B/tests/data/paco_sample.ldr "$RUNNER_TEMP/print_shape" --mode modules --shape-aware
          test -f "$RUNNER_TEMP/print_shape/modules_shape_export/dowel_peg.stl"
          "$LEGO_ENGINE_HOME/.venv/bin/python" -m lego_builder.print3d.coupon "$RUNNER_TEMP/coupon"
          for d in print_shape coupon; do PYTHONPATH=/tmp/print_site:$PYTHONPATH "$LEGO_ENGINE_HOME/.venv/bin/python" $B/tests/validate_print_exports.py "$RUNNER_TEMP/$d" 250; done
          PYTHONPATH=/tmp/print_site:$PYTHONPATH "$LEGO_ENGINE_HOME/.venv/bin/python" $B/tools/audit_print_exports.py $B/print_export_results "$RUNNER_TEMP/print_audit.json"
      - name: Independent slice of the coupon (PrusaSlicer, NOT Bambu Studio) - informational
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends prusa-slicer
          python3 benchmark-results/lego-builder/tools/slice_check.py "$RUNNER_TEMP/coupon/tolerance_coupon_plate.3mf" "$RUNNER_TEMP/slicing"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lego-builder-print-export
          retention-days: 14
          path: |
            ${{ runner.temp }}/print/comparison.json
            ${{ runner.temp }}/print/bricks/report_bricks.json
            ${{ runner.temp }}/print/modules_export/report_modules.json
            ${{ runner.temp }}/print_shape/modules_shape_export/report_modules.json
            ${{ runner.temp }}/coupon/coupon.json
            ${{ runner.temp }}/slicing/*.json

  photos-to-lego:
    if: github.event_name == 'workflow_dispatch' && inputs.run_reconstruction || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEGO_ENGINE_HOME: ${{ github.workspace }}/benchmark-results/20_portable_engine
      LEGO_NODE_MODULES: ${{ github.workspace }}/benchmark-results/20_portable_engine/node_modules
      NODE_PATH: ${{ github.workspace }}/benchmark-results/20_portable_engine/node_modules
      PYTHONPATH: ${{ github.workspace }}/benchmark-results/lego-builder:${{ github.workspace }}/benchmark-results/maps-engine-v03/style_fidelity_v062
      LEGO_GRADIO_PATH: /tmp/gradio_site
      LEGO_RECON_TIMEOUT: "480"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Fetch the GLB and the four photographs (Git LFS)
        run: git lfs install --local && git lfs pull --include="benchmark-results/02_glb_gratuit_hunyuan2mv/*.glb,benchmark-results/01_inputs_prepared/*.png"
      - name: Install pinned engine dependencies
        run: bash benchmark-results/20_portable_engine/scripts/install.sh
      - name: Install browser and the reconstruction client
        run: |
          cd benchmark-results/20_portable_engine && npx playwright install chromium
          python3 -m pip install --target /tmp/gradio_site -r "$GITHUB_WORKSPACE/benchmark-results/lego-builder/requirements-reconstruct.txt"
      - name: Four photographs of Paco -> GLB -> LEGO sculpture, ONE command
        run: |
          I=benchmark-results/01_inputs_prepared
          "$LEGO_ENGINE_HOME/.venv/bin/python" -m lego_builder run --photos $I/paco_face_rgba.png $I/paco_dos_rgba.png $I/paco_profil_gauche_rgba.png $I/paco_profil_droit_rgba.png --out "$RUNNER_TEMP/paco_photos" --size-mm 400 --notice off
      - name: BLOCKING - reconstructed GLB geometry and colours equal the reference Paco GLB
        run: |
          "$LEGO_ENGINE_HOME/.venv/bin/python" benchmark-results/lego-builder/tests/compare_glb.py "$RUNNER_TEMP/paco_photos/derived/paco_photos_couleur.glb" benchmark-results/02_glb_gratuit_hunyuan2mv/paco.glb
      - name: BLOCKING - the photo-built sculpture equals the accepted V12.1 sha256
        run: python3 benchmark-results/lego-builder/tests/check_regression.py sculpture paco_from_photos "$RUNNER_TEMP/paco_photos/model/diorama.ldr" paco_V121_A_palette_V12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lego-builder-photos-to-lego
          retention-days: 14
          path: |
            ${{ runner.temp }}/paco_photos/manifest.json
            ${{ runner.temp }}/paco_photos/reconstruct.log
            ${{ runner.temp }}/paco_photos/derived/projection_couleurs.json
            ${{ runner.temp }}/paco_photos/model/diorama.ldr
            ${{ runner.temp }}/paco_photos/model/renders/*.png
